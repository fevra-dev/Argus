[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.2.1"
description = "Argus - Intelligence-Driven Security Scanner (The All-Seeing Eye)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Fevra", email = "fev.dev@proton.me"}
]
keywords = [
    "security",
    "pentesting",
    "vulnerability-scanner",
    "credentials",
    "network-security",
    "cve",
    "default-credentials"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "paramiko>=3.3.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/fevra-dev/Argus"
Repository = "https://github.com/fevra-dev/Argus.git"
Issues = "https://github.com/fevra-dev/Argus/issues"

[project.scripts]
argus = "argus.cli:main"
